<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      color: #18212f;
      background: #f7f8f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .shell {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 6px;
      border-bottom: 1px solid #d9dee7;
      background: #ffffff;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 650;
      letter-spacing: 0;
    }

    h1 {
      font-size: 14px;
    }

    h2 {
      font-size: 12px;
      color: #263548;
    }

    main {
      display: grid;
      gap: 6px;
      padding: 6px 10px 8px;
    }

    section {
      display: grid;
      gap: 6px;
      padding: 8px;
      border: 1px solid #d9dee7;
      border-radius: 8px;
      background: #ffffff;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 6px 10px 0;
      background: #ffffff;
    }

    .tab {
      height: 26px;
      border-color: transparent;
      background: #eef2f7;
      color: #3b4656;
    }

    .tab.active {
      border-color: #174f8f;
      background: #174f8f;
      color: #ffffff;
    }

    .tab-panel[hidden] {
      display: none;
    }

    label {
      display: grid;
      gap: 4px;
      color: #3b4656;
      font-size: 11px;
      font-weight: 600;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid #c9d0dc;
      border-radius: 6px;
      background: #ffffff;
      color: #18212f;
      font: inherit;
      font-weight: 400;
      outline: none;
    }

    textarea {
      min-height: 50px;
      max-height: 160px;
      resize: vertical;
      padding: 6px 8px;
      line-height: 1.35;
    }

    input {
      height: 28px;
      padding: 0 8px;
    }

    textarea:focus,
    input:focus {
      border-color: #2b6cb0;
      box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.14);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .selection {
      min-width: 92px;
      border-radius: 999px;
      padding: 4px 8px;
      background: #eef2f7;
      color: #3b4656;
      text-align: center;
      font-size: 11px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .endpoint-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      border: 1px solid #d9dee7;
      border-radius: 6px;
      padding: 6px;
      background: #f7f8f9;
    }

    .endpoint-row {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .endpoint-label {
      color: #657286;
      font-size: 11px;
      font-weight: 650;
    }

    .endpoint-value {
      overflow: hidden;
      color: #172033;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .connect-status {
      min-height: 16px;
      border-radius: 6px;
      padding: 0;
      background: transparent;
      color: #3b4656;
      font-size: 11px;
      line-height: 1.25;
    }

    .connect-status.strong {
      color: #1f6b36;
    }

    .validation-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .summary-cell {
      display: grid;
      gap: 1px;
      min-width: 0;
      border: 1px solid #d9dee7;
      border-radius: 6px;
      padding: 5px 4px;
      background: #f7f8f9;
      text-align: center;
    }

    .summary-count {
      color: #172033;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .summary-label {
      overflow: hidden;
      color: #657286;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .filter {
      height: 26px;
      padding: 0 4px;
    }

    .filter.active {
      border-color: #174f8f;
      background: #e9f2ff;
      color: #174f8f;
    }

    .issue-list {
      display: grid;
      gap: 6px;
      min-height: 130px;
      max-height: 210px;
      overflow: auto;
    }

    .issue-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: start;
      border: 1px solid #d9dee7;
      border-left-width: 4px;
      border-radius: 6px;
      padding: 6px;
      background: #ffffff;
    }

    .issue-row.error {
      border-left-color: #b42318;
    }

    .issue-row.warning {
      border-left-color: #b7791f;
    }

    .issue-row.info {
      border-left-color: #2b6cb0;
    }

    .issue-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .issue-title {
      color: #172033;
      font-weight: 700;
      line-height: 1.2;
    }

    .issue-meta,
    .issue-description,
    .empty-report {
      color: #657286;
      font-size: 11px;
      line-height: 1.25;
    }

    .locate {
      min-width: 54px;
      height: 26px;
      padding: 0 6px;
    }

    #cleanStaleIndexes,
    #deepAuditRepairIndex {
      min-width: 126px;
    }

    button {
      height: 28px;
      border: 1px solid #b8c1ce;
      border-radius: 6px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-weight: 650;
      padding: 0 8px;
      cursor: pointer;
    }

    button.primary {
      border-color: #174f8f;
      background: #174f8f;
      color: #ffffff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    footer {
      margin-top: auto;
      display: grid;
      gap: 6px;
      padding: 0 10px 6px;
    }

    #status {
      min-height: 24px;
      border: 1px solid #d9dee7;
      border-radius: 6px;
      padding: 5px 8px;
      background: #ffffff;
      color: #3b4656;
      line-height: 1.25;
    }

    #status.success {
      border-color: #9ac3a7;
      background: #edf8f0;
      color: #1f6b36;
    }

    #status.error {
      border-color: #d99b9b;
      background: #fff1f1;
      color: #8f2020;
    }

    #status.running {
      border-color: #9db9dc;
      background: #f0f6ff;
      color: #174f8f;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Flow Annotator</h1>
      <button id="close" type="button">Close</button>
    </header>

    <nav class="tabs" aria-label="Flow Annotator sections">
      <button id="tabAnnotate" class="tab active" type="button" data-tab="annotate">Annotate</button>
      <button id="tabConnect" class="tab" type="button" data-tab="connect">Connect</button>
      <button id="tabValidate" class="tab" type="button" data-tab="validate">Validate</button>
    </nav>

    <main>
      <section id="panelAnnotate" class="tab-panel" data-tab-panel="annotate">
        <div class="row">
          <h2>Annotate</h2>
          <div id="selection" class="selection">0 selected</div>
        </div>
        <label>
          Annotation Body
          <textarea id="annotationBody" placeholder="Design note, interaction rule, or state detail"></textarea>
        </label>
        <div class="actions">
          <button id="createAnnotation" class="primary" type="button">Create Annotation</button>
          <button id="addSubjectNodes" type="button">Add Subject Nodes</button>
        </div>
        <div class="actions">
          <button id="arrangeBadges" type="button">Arrange Badges</button>
          <button id="arrangeCards" type="button">Arrange Cards</button>
        </div>
      </section>

      <section id="panelConnect" class="tab-panel" data-tab-panel="connect" hidden>
        <div class="row">
          <h2>Connect</h2>
          <div id="connectorState" class="selection">2 endpoints</div>
        </div>
        <label>
          Flow Action
          <input id="flowAction" type="text" placeholder="click, choose, input">
        </label>
        <div class="endpoint-preview" aria-label="Pending Flow Endpoints">
          <div class="endpoint-row">
            <div class="endpoint-label">Start</div>
            <div id="startEndpoint" class="endpoint-value">None</div>
          </div>
          <div class="endpoint-row">
            <div class="endpoint-label">End</div>
            <div id="endEndpoint" class="endpoint-value">None</div>
          </div>
        </div>
        <div id="routingStatus" class="connect-status">Select two Flow Endpoints to preview a Connector Route.</div>
        <div id="existingConnectorStatus" class="connect-status">No existing Flow Connector.</div>
        <div class="actions">
          <button id="swapConnector" type="button">Swap</button>
          <button id="createConnector" class="primary" type="button">Create Flow Connector</button>
        </div>
        <div class="actions">
          <button id="refreshConnectors" type="button">Refresh Connectors</button>
        </div>
      </section>

      <section id="panelValidate" class="tab-panel" data-tab-panel="validate" hidden>
        <div class="row">
          <h2>Validate</h2>
          <div class="actions">
            <button id="runValidation" class="primary" type="button">Validate Bindings</button>
            <button id="cleanStaleIndexes" type="button" disabled>Clean Stale Indexes</button>
            <button id="deepAuditRepairIndex" type="button">Deep Audit Repair</button>
          </div>
        </div>
        <div class="validation-summary" aria-label="Validation summary">
          <div class="summary-cell"><div id="summaryAll" class="summary-count">0</div><div class="summary-label">All</div></div>
          <div class="summary-cell"><div id="summaryErrors" class="summary-count">0</div><div class="summary-label">Errors</div></div>
          <div class="summary-cell"><div id="summaryWarnings" class="summary-count">0</div><div class="summary-label">Warnings</div></div>
          <div class="summary-cell"><div id="summaryInfo" class="summary-count">0</div><div class="summary-label">Info</div></div>
        </div>
        <div class="filters" aria-label="Validation filters">
          <button class="filter active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="error">Errors</button>
          <button class="filter" type="button" data-filter="warning">Warnings</button>
          <button class="filter" type="button" data-filter="info">Info</button>
        </div>
        <div id="validationIssues" class="issue-list">
          <div class="empty-report">Run validation to inspect bindings.</div>
        </div>
      </section>
    </main>

    <footer>
      <div id="status">Ready.</div>
    </footer>
  </div>

  <script>
    const annotationBody = document.getElementById('annotationBody');
    const flowAction = document.getElementById('flowAction');
    const createAnnotation = document.getElementById('createAnnotation');
    const addSubjectNodes = document.getElementById('addSubjectNodes');
    const arrangeBadges = document.getElementById('arrangeBadges');
    const arrangeCards = document.getElementById('arrangeCards');
    const createConnector = document.getElementById('createConnector');
    const refreshConnectors = document.getElementById('refreshConnectors');
    const swapConnector = document.getElementById('swapConnector');
    const runValidation = document.getElementById('runValidation');
    const cleanStaleIndexes = document.getElementById('cleanStaleIndexes');
    const deepAuditRepairIndex = document.getElementById('deepAuditRepairIndex');
    const closeButton = document.getElementById('close');
    const status = document.getElementById('status');
    const selection = document.getElementById('selection');
    const connectorState = document.getElementById('connectorState');
    const startEndpoint = document.getElementById('startEndpoint');
    const endEndpoint = document.getElementById('endEndpoint');
    const routingStatus = document.getElementById('routingStatus');
    const existingConnectorStatus = document.getElementById('existingConnectorStatus');
    const panelValidate = document.getElementById('panelValidate');
    const validationIssues = document.getElementById('validationIssues');
    const summaryAll = document.getElementById('summaryAll');
    const summaryErrors = document.getElementById('summaryErrors');
    const summaryWarnings = document.getElementById('summaryWarnings');
    const summaryInfo = document.getElementById('summaryInfo');
    const tabButtons = Array.from(document.querySelectorAll('.tab'));
    const tabPanels = Array.from(document.querySelectorAll('.tab-panel'));
    const filterButtons = Array.from(document.querySelectorAll('.filter'));

    let totalSelection = 0;
    let eligibleSelection = 0;
    let selectedAnnotationCardCount = 0;
    let connectorEndpoints = [];
    let existingConnector = null;
    let currentRoutingStatus = 'Select two Flow Endpoints to preview a Connector Route.';
    let activeFilter = 'all';
    let validationOperation = null;
    let validationReport = {
      schemaVersion: 1,
      issues: [],
      summary: { all: 0, errors: 0, warnings: 0, info: 0 },
    };

    tabButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setActiveTab(button.dataset.tab);
      });
    });

    createAnnotation.addEventListener('click', () => {
      const body = annotationBody.value.trim();
      if (body.length === 0) {
        setStatus('error', 'Annotation Body is required.');
        return;
      }
      post({ type: 'create-annotation', body });
    });

    addSubjectNodes.addEventListener('click', () => {
      post({ type: 'add-subject-nodes' });
    });

    arrangeBadges.addEventListener('click', () => {
      post({ type: 'arrange-badges' });
    });

    arrangeCards.addEventListener('click', () => {
      post({ type: 'arrange-cards' });
    });

    createConnector.addEventListener('click', () => {
      post({ type: 'create-connector', flowAction: flowAction.value.trim() });
    });

    refreshConnectors.addEventListener('click', () => {
      post({ type: 'refresh-connectors' });
    });

    swapConnector.addEventListener('click', () => {
      post({ type: 'swap-connector-endpoints' });
    });

    runValidation.addEventListener('click', () => {
      if (startValidationOperation('validate-bindings')) {
        post({ type: 'validate-bindings' });
      }
    });

    cleanStaleIndexes.addEventListener('click', () => {
      if (startValidationOperation('clean-stale-indexes')) {
        post({ type: 'clean-stale-indexes' });
      }
    });

    deepAuditRepairIndex.addEventListener('click', () => {
      if (startValidationOperation('deep-audit-repair-index')) {
        post({ type: 'deep-audit-repair-index' });
      }
    });

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        renderValidationReport();
      });
    });

    validationIssues.addEventListener('click', (event) => {
      const button = event.target.closest('[data-issue-id]');
      if (!button) {
        return;
      }
      post({ type: 'locate-validation-issue', issueId: button.dataset.issueId });
    });

    closeButton.addEventListener('click', () => {
      post({ type: 'close' });
    });

    window.addEventListener('message', (event) => {
      const message = event.data.pluginMessage;
      if (!message) {
        return;
      }

      if (message.type === 'selection-state') {
        totalSelection = message.totalCount;
        eligibleSelection = message.eligibleCount;
        selectedAnnotationCardCount = message.selectedAnnotationCardCount || 0;
        connectorEndpoints = Array.isArray(message.connectorEndpoints) ? message.connectorEndpoints : [];
        existingConnector = message.existingConnector || null;
        currentRoutingStatus = message.routingStatus || 'Select two Flow Endpoints to preview a Connector Route.';
        renderSelectionState();
        return;
      }

      if (message.type === 'status') {
        setStatus(message.tone, message.message);
        return;
      }

      if (message.type === 'validation-operation') {
        applyValidationOperationMessage(message);
        return;
      }

      if (message.type === 'validation-report') {
        validationReport = message.report;
        setActiveTab('validate');
        renderValidationReport();
      }
    });

    annotationBody.addEventListener('input', renderSelectionState);

    function post(pluginMessage) {
      parent.postMessage({ pluginMessage }, '*');
    }

    function renderSelectionState() {
      selection.textContent = `${eligibleSelection} subject${eligibleSelection === 1 ? '' : 's'}`;
      connectorState.textContent = `${connectorEndpoints.length}/2 endpoints`;
      startEndpoint.textContent = connectorEndpoints[0] ? connectorEndpoints[0].name : 'None';
      endEndpoint.textContent = connectorEndpoints[1] ? connectorEndpoints[1].name : 'None';
      routingStatus.textContent = currentRoutingStatus;
      existingConnectorStatus.textContent = existingConnector
        ? `Existing Flow Connector: ${existingConnector.flowAction || 'No Flow Action'}`
        : 'No existing Flow Connector.';
      existingConnectorStatus.className = existingConnector ? 'connect-status strong' : 'connect-status';
      createAnnotation.disabled = eligibleSelection === 0 || annotationBody.value.trim().length === 0;
      addSubjectNodes.disabled = eligibleSelection === 0 || selectedAnnotationCardCount !== 1;
      arrangeBadges.disabled = eligibleSelection === 0;
      arrangeCards.disabled = false;
      swapConnector.disabled = connectorEndpoints.length !== 2;
      createConnector.disabled = connectorEndpoints.length !== 2;
      refreshConnectors.disabled = false;
    }

    function startValidationOperation(operation) {
      if (validationOperation !== null) {
        return false;
      }
      setActiveTab('validate');
      setValidationOperation(operation, true, `${formatValidationOperationLabel(operation)} is running.`);
      return true;
    }

    function applyValidationOperationMessage(message) {
      setValidationOperation(
        message.operation,
        message.state === 'running',
        message.message || `${formatValidationOperationLabel(message.operation)} is running.`,
      );
    }

    function setValidationOperation(operation, isRunning, message) {
      validationOperation = isRunning ? operation : null;
      panelValidate.setAttribute('aria-busy', validationOperation === null ? 'false' : 'true');
      if (isRunning) {
        setStatus('running', message);
      }
      renderValidationControls();
    }

    function setActiveTab(tab) {
      tabButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === tab);
      });
      tabPanels.forEach((panel) => {
        panel.hidden = panel.dataset.tabPanel !== tab;
      });
    }

    function renderValidationReport() {
      const summary = validationReport.summary || { all: 0, errors: 0, warnings: 0, info: 0 };
      summaryAll.textContent = String(summary.all || 0);
      summaryErrors.textContent = String(summary.errors || 0);
      summaryWarnings.textContent = String(summary.warnings || 0);
      summaryInfo.textContent = String(summary.info || 0);
      filterButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.filter === activeFilter);
      });

      const issues = Array.isArray(validationReport.issues) ? validationReport.issues : [];
      renderValidationControls();
      const filtered = activeFilter === 'all'
        ? issues
        : issues.filter((issue) => issue.severity === activeFilter);
      if (filtered.length === 0) {
        validationIssues.innerHTML = `<div class="empty-report">${issues.length === 0 ? 'No validation issues found.' : 'No issues match this filter.'}</div>`;
        return;
      }

      validationIssues.innerHTML = filtered.map((issue) => `
        <div class="issue-row ${issue.severity}">
          <div class="issue-copy">
            <div class="issue-title">${escapeHtml(issue.title)}</div>
            <div class="issue-meta">${formatSeverity(issue.severity)} - ${issue.affectedObjectCount} affected</div>
            <div class="issue-description">${escapeHtml(issue.description)}</div>
          </div>
          <button class="locate" type="button" data-issue-id="${escapeHtml(issue.id)}">Locate</button>
        </div>
      `).join('');
    }

    function renderValidationControls() {
      const issues = Array.isArray(validationReport.issues) ? validationReport.issues : [];
      const isRunning = validationOperation !== null;
      runValidation.disabled = isRunning;
      cleanStaleIndexes.disabled =
        isRunning || !issues.some((issue) => issue.code === 'connector-reverse-index-stale');
      deepAuditRepairIndex.disabled = isRunning;
    }

    function formatValidationOperationLabel(operation) {
      if (operation === 'clean-stale-indexes') {
        return 'Clean Stale Indexes';
      }
      if (operation === 'deep-audit-repair-index') {
        return 'Deep Audit Repair';
      }
      return 'Validate Bindings';
    }

    function formatSeverity(severity) {
      if (severity === 'error') {
        return 'Error';
      }
      if (severity === 'warning') {
        return 'Warning';
      }
      return 'Info';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[character]));
    }

    function setStatus(tone, message) {
      status.className = tone === 'success' || tone === 'error' || tone === 'running' ? tone : '';
      status.textContent = message;
    }

    post({ type: 'request-selection-state' });
    renderSelectionState();
    renderValidationControls();
  </script>
</body>
</html>
